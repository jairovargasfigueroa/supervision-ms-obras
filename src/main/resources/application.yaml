spring:
  application:
    name: obras
  # Datos locales que no se suben al repositorio (por ejemplo, la contraseña de la base)
  config:
    import: optional:file:.env.properties

  datasource:
    url: jdbc:postgresql://${OBRAS_DB_HOST:localhost}:${OBRAS_DB_PORT:5433}/${OBRAS_DB_NAME:obras_db}
    username: ${OBRAS_DB_USER:obras}
    password: ${OBRAS_DB_PASSWORD}

  jpa:
    # El esquema lo crea Flyway; Hibernate solo verifica que coincida
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# Token de Keycloak (ConfiguracionSeguridad): emisor y audiencia que se exigen. La firma se valida con el JWKS del emisor.
obras:
  seguridad:
    emisor: ${OBRAS_KEYCLOAK_ISSUER:http://localhost:8080/realms/supervision}
    audiencia: plataforma-api
  cors:
    origenes: ${OBRAS_CORS_ORIGENES:http://localhost:4300}

server:
  port: ${OBRAS_PORT:8081}

logging:
  pattern:
    # Cada línea lleva el X-Request-Id de la petición (FiltroRequestId)
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # RabbitMQ todavía no está instalado; se activa cuando lo levantemos
    rabbit:
      enabled: false
