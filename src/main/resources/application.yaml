spring:
  application:
    name: obras
  # Datos locales que no se suben al repositorio (por ejemplo, la contraseña de la base)
  config:
    import: optional:file:.env.properties

  datasource:
    url: jdbc:postgresql://${OBRAS_DB_HOST:localhost}:${OBRAS_DB_PORT:5433}/${OBRAS_DB_NAME:obras_db}
    username: ${OBRAS_DB_USER:obras}
    password: ${OBRAS_DB_PASSWORD}

  jpa:
    # El esquema lo crea Flyway; Hibernate solo verifica que coincida
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Mensajería (convenciones, «Eventos y comandos»): exchange plataforma y cola obras
  rabbitmq:
    host: ${OBRAS_RABBITMQ_HOST:localhost}
    port: ${OBRAS_RABBITMQ_PORT:5672}
    username: ${OBRAS_RABBITMQ_USER:obras}
    password: ${OBRAS_RABBITMQ_PASSWORD:}
    # PublicadorOutbox espera la confirmación de cada mensaje antes de marcarlo publicado
    publisher-confirm-type: simple

# Token de Keycloak (ConfiguracionSeguridad): emisor y audiencia que se exigen. La firma se valida con el JWKS del emisor.
obras:
  seguridad:
    emisor: ${OBRAS_KEYCLOAK_ISSUER:http://localhost:8080/realms/supervision}
    audiencia: plataforma-api
  cors:
    origenes: ${OBRAS_CORS_ORIGENES:http://localhost:4300}
  mensajeria:
    # Cada cuánto PublicadorOutbox envía los mensajes pendientes del outbox
    intervalo-outbox-ms: 1000
  saga:
    # Cada cuánto VencimientoSagaTarea busca pasos de la saga sin respuesta pasados sus 60 s (008)
    intervalo-vencimiento-ms: 10000
  # Fotos de avance en S3 (ConfiguracionS3, docs/entorno-local.md). Si falta el bucket o una clave, el servicio
  # arranca igual y las rutas que firman URL responden 503 SERVICIO_NO_DISPONIBLE.
  s3:
    region: ${OBRAS_S3_REGION:sa-east-1}
    bucket: ${OBRAS_S3_BUCKET:}
    access-key: ${OBRAS_S3_ACCESS_KEY:}
    secret-key: ${OBRAS_S3_SECRET_KEY:}

server:
  port: ${OBRAS_PORT:8081}

logging:
  pattern:
    # Cada línea lleva el X-Request-Id de la petición (FiltroRequestId)
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
