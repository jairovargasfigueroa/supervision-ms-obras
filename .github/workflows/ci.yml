# 601 · CI de Obras (docs/specs/601-contenedores-ci/ de supervision-docs). En cada pull request hacia develop o main:
# pruebas (unitarias y de integración con Testcontainers) y la imagen sin publicar. En cada push a main (un release):
# además publica la imagen en GHCR con las etiquetas sha-<7 caracteres> y main. Solo usa el GITHUB_TOKEN.
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEN: ghcr.io/jairovargasfigueroa/supervision-ms-obras

jobs:
  prueba:
    name: Pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compila y corre todas las pruebas; las *IT levantan PostgreSQL y RabbitMQ con el Docker del runner
      - name: ./mvnw -B verify
        run: ./mvnw -B verify

  imagen:
    name: Imagen
    needs: prueba
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Etiquetas
        id: etiquetas
        run: echo "lista=${IMAGEN}:sha-${GITHUB_SHA::7},${IMAGEN}:main" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # En un PR solo construye (sin push); en main construye y publica
      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.etiquetas.outputs.lista }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
